version: 2

models:
  - name: silver_orders
    description: One row per order_id — cleaned timestamps plus derived delivery flags.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

  - name: silver_order_items
    description: One row per (order_id, order_item_id) — enriched with product category and weight.
    columns:
      - name: order_id
        tests:
          - not_null

  - name: silver_sellers
    description: Seller dimension, one row per seller_id.
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: silver_comtrade_trade_flows
    description: One row per (reporter, period, flow) — Comtrade grand totals only (motCode = '0'), mode-of-transport breakdown rows excluded.
    columns:
      - name: reporter_code
        tests:
          - not_null
      - name: flow_type
        tests:
          - accepted_values:
              arguments:
                values: ["import", "export"]

  - name: silver_world_bank_lpi
    description: One row per (country, indicator, year) — tidy/long LPI records.
    columns:
      - name: country_code
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: silver_comtrade_partner_flows
    description: One row per (reporter, period, flow, commodity, partner country) — Comtrade partner-level breakdowns, aggregate/residual pseudo-partners (", nes", Bunkers, Free Zones, Special Categories) excluded.
    columns:
      - name: partner_code
        tests:
          - not_null
      - name: partner_name
        tests:
          - not_null

  - name: silver_order_item_emissions
    description: One row per (order_id, order_item_id) — estimated spend-based Scope 3 kg CO2e, via category_to_naics and epa_ghg_emission_factors. NULL factor/estimate for items whose category has no NAICS mapping or is itself NULL.
    columns:
      - name: order_id
        tests:
          - not_null

  - name: comtrade_partner_areas
    description: "Seed: UN Comtrade's own partner-country reference data (pulled from https://comtradeapi.un.org/files/v1/app/reference/partnerAreas.json), not hand-typed."
    columns:
      - name: partner_code
        tests:
          - unique
          - not_null

  - name: category_to_naics
    description: >
      Seed: hand-built mapping from each of Olist's 73 real product_category
      values (as they actually appear in silver_order_items — not the 71 from the
      translation table alone, since 2 categories have no English translation
      row) to one 2017 NAICS-6 commodity code each, with a one-sentence rationale
      per row. Judgment-based, not algorithmic — see DECISIONS.md, Phase 8, for
      the method and its limits.
    columns:
      - name: product_category
        tests:
          - unique
          - not_null
      - name: naics_code
        tests:
          - not_null

  - name: epa_ghg_emission_factors
    description: >
      Seed: EPA Supply Chain GHG Emission Factors for US Industries and Commodities,
      v1.3.0 (published 2024-07-05), pulled directly from
      https://pasteur.epa.gov/uploads/10.23719/1531143/SupplyChainGHGEmissionFactors_v1.3.0_NAICS_CO2e_USD2022.csv
      — not hand-typed or approximated. One row per 2017 NAICS-6 commodity code
      (1,016 rows). Units are kg CO2e per 2022 USD of purchaser-price spend.
      `factor_without_margins_kg_co2e_per_usd` is the producer-price emission
      factor; `margins_kg_co2e_per_usd` adds wholesale/retail/transport margin
      emissions; `factor_with_margins_kg_co2e_per_usd` (without + margins) is the
      one used downstream, since Olist's order-item `price` is itself a
      purchaser/retail price, not a producer price — see DECISIONS.md, Phase 8.
    columns:
      - name: naics_code
        tests:
          - unique
          - not_null
      - name: factor_with_margins_kg_co2e_per_usd
        tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
