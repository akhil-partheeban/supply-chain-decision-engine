name: supply_chain
version: "1.0.0"
config-version: 2

profile: supply_chain

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  supply_chain:
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold

seeds:
  supply_chain:
    # Reference/lookup data (e.g. comtrade_partner_areas) lands alongside silver —
    # it's cleaned, typed, static data consumed the same way a silver model is, just
    # sourced from a CSV instead of a transform. Without an explicit +schema here,
    # dbt falls back to generate_schema_name's default_schema (macros/
    # generate_schema_name.sql), which is blank for this project's DuckDB profile
    # (profiles.yml sets no top-level `schema:`) — models never hit this because
    # they always set +schema explicitly, but seeds did until this was added.
    +schema: silver

# This project's first dbt vars — all for the supplier emissions layer (see
# DECISIONS.md, Phase 8). Everything else in this project has used hardcoded
# constants with a header-comment rationale instead (e.g. the 50/30/20 reliability
# weights); these are vars specifically because they're currency/inflation
# assumptions a reader might reasonably want to override or re-date, not tuned
# model parameters.
vars:
  # Olist order prices are nominal BRL, mostly from 2017-2018 (2018 is the modal
  # order year: 54% of orders). EPA's emission factors are kg CO2e per 2022 USD.
  # Converting BRL spend to a comparable basis is a two-step, both steps documented
  # here rather than folded into one opaque constant:
  #   1. BRL -> nominal-year USD, at a real historical FX rate (not PPP-adjusted).
  #   2. nominal-year USD -> 2022-USD-equivalent, via US CPI-U (BLS, 1982-84=100
  #      annual average), so the result is on the same inflation basis as the EPA
  #      factors it gets multiplied against.
  # Source: x-rates.com yearly average, USD/BRL 2018 = 3.6656 (1 USD = 3.6656 BRL).
  brl_to_usd_rate: 0.2728       # = 1 / 3.6656
  brl_to_usd_rate_year: 2018
  # Source: BLS CPI-U, U.S. city average, all items, annual average (1982-84=100):
  # 2018 = 251.107, 2022 = 292.655. Adjustment factor = 292.655 / 251.107.
  cpi_2018_to_2022_adjustment: 1.1655

  # Emissions-vs-risk blended score (gold_supplier_risk_emissions_score): weight on
  # the risk/reliability percentile; the emissions percentile gets (1 - this), so
  # the two always sum to 1 rather than being independently tunable and able to
  # drift apart.
  emissions_score_risk_weight: 0.5
